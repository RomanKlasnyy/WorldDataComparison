# Source-specific name and code aliases. Resolution order:
#   1. ISO3 code in countries.yaml
#   2. code_aliases below (e.g. OWID pseudo-codes)
#   3. aliases below, keyed by ISO3 (normalized: casefold, strip accents/punctuation)
#   4. normalized match against the country display name and official name
#
# Block lists are used deliberately: flow lists ([a, b]) split on commas and would
# break names such as "Korea, Rep.".
code_aliases:
  OWID_KOS: XKX
  OWID_TWN: TWN
  OWID_PSE: PSE
  OWID_VAT: VAT

